spring:
  datasource:
    url: jdbc:h2:file:./data/taskmanager;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
app:
  dados-demonstracao:
    habilitados: true
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
    expiracao: 86400000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
